# SPDX-License-Identifier: GPL-2.0-only
name: Native checks
on: [push, pull_request]
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go run ./tools/source-map.go -check
      - name: Windows service install/start/stop/uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-service-smoke.ps1
  release-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: make check
      - run: make release VERSION=ci
      - uses: docker/setup-buildx-action@v4
      - name: Build both Linux image architectures without emulation
        run: |
          mkdir -p runtime
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=ci --output type=oci,dest=runtime/linux-images.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: native-archives
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-images
          path: runtime/linux-images.tar
